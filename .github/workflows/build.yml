name: Build Kindle GTK App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
    - uses: actions/checkout@v4

    - name: Set up Cross-Compilation Environment
      run: |
        dpkg --add-architecture armel
        # 根因修复：重写 sources.list，显式声明同时拉取 amd64 和 armel 两种架构
        echo "deb [arch=amd64,armel] http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list
        echo "deb [arch=amd64,armel] http://deb.debian.org/debian-security bullseye-security main" >> /etc/apt/sources.list
        echo "deb [arch=amd64,armel] http://deb.debian.org/debian bullseye-updates main" >> /etc/apt/sources.list
        rm -rf /var/lib/apt/lists/*
        apt-get update -y
        apt-get install -y crossbuild-essential-armel libgtk2.0-dev:armel pkg-config file

    - name: Compile Application
      run: |
        # 告诉 pkg-config 寻找 armel 架构的库文件，而不是宿主机 amd64 的库
        export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabi/pkgconfig:/usr/share/pkgconfig
        export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabi/pkgconfig
        
        # 使用 g++-arm-linux-gnueabi 交叉编译
        arm-linux-gnueabi-g++ main.cpp -o kindlestats_app $(pkg-config --cflags --libs gtk+-2.0)
        
        # 验证编译产物架构
        file kindlestats_app

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: kindlestats_app
        path: kindlestats_app
