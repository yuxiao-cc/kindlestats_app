name: Build Kindle GTK App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU (ARM emulation)
      uses: docker/setup-qemu-action@v3

    - name: Build natively inside ARM container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          arm32v5/debian:bullseye bash -c "
            echo 'deb [trusted=yes] http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list &&
            rm -rf /var/lib/apt/lists/* &&
            apt-get -o Acquire::Check-Valid-Until=false update -y &&
            apt-get install -y g++ libgtk2.0-dev pkg-config file &&
            g++ -Iinclude main.cpp shared.cpp draw_callbacks.cpp month_dialog.cpp \
               dashboard_page.cpp books_page.cpp today_page.cpp \
               -o kindlestats_app \
              \$(pkg-config --cflags --libs gtk+-2.0) \
              -static-libstdc++ -pthread &&
            file kindlestats_app &&
            echo '=== Build successful! ==='
          "

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: kindlestats_app
        path: kindlestats_app
